services:
  # ==============================================================
  # 1. Backend Microservice (CQRS Command & Query Ledger)
  # ==============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: audit-trail-backend:latest
    container_name: audit-trail-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/audit-trail-ledger
      - ENABLE_REDIS=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENABLE_RABBITMQ=true
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - audit-trail-net
    restart: unless-stopped

  # ==============================================================
  # 2. Frontend Microservice (React Vite SPA with Nginx Proxy)
  # ==============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: audit-trail-frontend:latest
    container_name: audit-trail-frontend
    ports:
      - "5173:80"
    depends_on:
      - app
    networks:
      - audit-trail-net
    restart: unless-stopped

  # ==============================================================
  # 3. Persistent Database (MongoDB Event Store & Read Models)
  # ==============================================================
  mongo:
    image: mongo:7.0
    container_name: audit-trail-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audit-trail-net
    restart: unless-stopped

  # ==============================================================
  # 4. Distributed Caching (Redis 7 Alpine)
  # ==============================================================
  redis:
    image: redis:7-alpine
    container_name: audit-trail-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - audit-trail-net
    restart: unless-stopped

  # ==============================================================
  # 5. Enterprise Message Broker (RabbitMQ with Management UI)
  # ==============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: audit-trail-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audit-trail-net
    restart: unless-stopped

  # ==============================================================
  # 6. Observability Metrics Scraper (Prometheus)
  # ==============================================================
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: audit-trail-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
    networks:
      - audit-trail-net
    restart: unless-stopped

  # ==============================================================
  # 7. Production Observability Dashboard (Grafana)
  # ==============================================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: audit-trail-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - audit-trail-net
    restart: unless-stopped

# ==============================================================
# Isolated Network & Named Volumes
# ==============================================================
networks:
  audit-trail-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
