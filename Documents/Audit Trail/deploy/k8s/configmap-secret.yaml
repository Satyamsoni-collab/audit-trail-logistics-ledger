apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-trail-config
  namespace: audit-trail
data:
  NODE_ENV: "production"
  PORT: "3000"
  MONGODB_URI: "mongodb://mongo-0.mongo.audit-trail.svc.cluster.local:27017/audit-trail-ledger"
  ENABLE_REDIS: "true"
  REDIS_HOST: "redis.audit-trail.svc.cluster.local"
  REDIS_PORT: "6379"
  ENABLE_RABBITMQ: "true"
  RABBITMQ_URL: "amqp://rabbitmq.audit-trail.svc.cluster.local:5672"
---
apiVersion: v1
kind: Secret
metadata:
  name: audit-trail-secrets
  namespace: audit-trail
type: Opaque
stringData:
  JWT_SECRET: "k8s-enterprise-production-signature-key-2026"
